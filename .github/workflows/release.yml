name: Build ThreadPilot release zip

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.0. Leave empty to use manifest.json."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: threadpilot-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          INPUT_TAG="${{ github.event.inputs.tag || '' }}"
          REF_NAME="${{ github.ref_name }}"
          MANIFEST_VERSION=$(python - <<'PY'
          import json
          with open('manifest.json', 'r', encoding='utf-8') as f:
              print(json.load(f)['version'])
          PY
          )

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="${INPUT_TAG#refs/tags/}"
          else
            TAG="v$MANIFEST_VERSION"
          fi

          VERSION="${TAG#v}"
          if [ "$TAG" = "$VERSION" ]; then
            echo "::error::Release tag must start with v, for example v1.0."
            exit 1
          fi
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Release tag/version $VERSION does not match manifest.json version $MANIFEST_VERSION."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG does not exist. Create and push the tag yourself before running release."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare extension package
        shell: bash
        run: |
          set -euo pipefail
          DIST="dist/threadpilot-for-chatgpt-${{ steps.version.outputs.version }}"
          mkdir -p "$DIST"

          cp manifest.json "$DIST/"
          cp content.js "$DIST/"
          cp styles.css "$DIST/"
          cp popup.html "$DIST/"
          cp popup.js "$DIST/"
          cp about.html "$DIST/"
          cp about.js "$DIST/"

          if [ -d icons ]; then cp -R icons "$DIST/icons"; fi

          cd dist
          zip -r "threadpilot-for-chatgpt-${{ steps.version.outputs.version }}.zip" "threadpilot-for-chatgpt-${{ steps.version.outputs.version }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/threadpilot-for-chatgpt-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
