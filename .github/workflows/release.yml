name: Build ThreadPilot release zip

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version. Leave empty to read manifest.json"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: threadpilot-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ github.event.inputs.version || '' }}"
          REF_NAME="${{ github.ref_name }}"
          MANIFEST_VERSION=$(python - <<'PY'
          import json
          with open('manifest.json', 'r', encoding='utf-8') as f:
              print(json.load(f)['version'])
          PY
          )
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v$VERSION"
          else
            VERSION="$MANIFEST_VERSION"
            TAG="v$VERSION"
          fi
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Release tag/version $VERSION does not match manifest.json version $MANIFEST_VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; reusing it for the release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "${{ github.sha }}"
          git push origin "refs/tags/$TAG"

      - name: Prepare extension package
        shell: bash
        run: |
          set -euo pipefail
          DIST="dist/threadpilot-for-chatgpt-${{ steps.version.outputs.version }}"
          mkdir -p "$DIST"

          cp manifest.json "$DIST/"
          cp content.js "$DIST/"
          cp styles.css "$DIST/"
          cp popup.html "$DIST/"
          cp popup.js "$DIST/"
          cp about.html "$DIST/"
          cp about.js "$DIST/"

          if [ -d icons ]; then cp -R icons "$DIST/icons"; fi
          if [ -f PRIVACY_POLICY.md ]; then cp PRIVACY_POLICY.md "$DIST/"; fi
          if [ -f README.md ]; then cp README.md "$DIST/"; fi
          if [ -f LICENSE ]; then cp LICENSE "$DIST/"; fi

          cd dist
          zip -r "threadpilot-for-chatgpt-${{ steps.version.outputs.version }}.zip" "threadpilot-for-chatgpt-${{ steps.version.outputs.version }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/threadpilot-for-chatgpt-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
