<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThreadPilot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand">
    <div class="brand-mark" aria-hidden="true">TP</div>
    <div>
      <h1>ThreadPilot</h1>
      <p>让长对话重新变得清晰</p>
    </div>
  </header>

  <main>
    <section class="primary-settings" aria-label="核心功能">
      <label class="setting-row" for="timelineEnabled">
        <span class="setting-copy">
          <strong>对话时间线</strong>
          <small>按你的提问定位每一轮</small>
        </span>
        <span class="switch">
          <input id="timelineEnabled" type="checkbox">
          <span aria-hidden="true"></span>
        </span>
      </label>

      <label class="setting-row" for="autoCollapse">
        <span class="setting-copy">
          <strong>自动折叠长回答</strong>
          <small>保留摘要，需要时再展开</small>
        </span>
        <span class="switch">
          <input id="autoCollapse" type="checkbox">
          <span aria-hidden="true"></span>
        </span>
      </label>
    </section>

    <fieldset class="fold-density">
      <legend>
        <span>自动折叠强度</span>
        <small id="presetHint">平衡阅读空间与上下文</small>
      </legend>
      <div class="segment">
        <label>
          <input type="radio" name="foldPreset" value="compact">
          <span>紧凑</span>
        </label>
        <label>
          <input type="radio" name="foldPreset" value="balanced">
          <span>平衡</span>
        </label>
        <label>
          <input type="radio" name="foldPreset" value="relaxed">
          <span>宽松</span>
        </label>
      </div>
    </fieldset>

    <section class="shortcuts" aria-label="快捷键">
      <div class="section-title">快捷键</div>
      <dl>
        <div><dt>时间线</dt><dd><kbd>Alt</kbd><span>+</span><kbd>J</kbd></dd></div>
        <div><dt>折叠 / 展开全部</dt><dd><kbd>Alt</kbd><span>+</span><kbd>C</kbd></dd></div>
        <div><dt>上一轮 / 下一轮</dt><dd><kbd>Alt</kbd><span>+</span><kbd>P</kbd><span>/</span><kbd>N</kbd></dd></div>
      </dl>
    </section>
  </main>

  <footer>
    <span id="status" role="status" aria-live="polite">设置自动保存</span>
    <a href="https://github.com/billowssun/threadpilot-for-chatgpt" target="_blank" rel="noreferrer">反馈</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
